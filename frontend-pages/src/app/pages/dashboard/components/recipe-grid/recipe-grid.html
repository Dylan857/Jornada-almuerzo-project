<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
  <div class="px-5 py-4 border-b border-slate-100">
    <h2 class="text-base font-semibold text-slate-800">Recetas disponibles</h2>
  </div>

  <div class="p-5">
    @if (warehouseService.recipes().length === 0) {
      <div class="py-6 text-center text-sm text-slate-400">
        Sin recetas cargadas
      </div>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        @for (recipe of warehouseService.recipes(); track recipe.id) {
          <div class="border border-slate-100 rounded-xl p-4 hover:border-blue-200
                      hover:bg-blue-50/30 transition-all duration-200">
            <p class="text-sm font-medium text-slate-800 mb-2">{{ recipe.name }}</p>
            <div class="flex flex-wrap gap-1">
              @for (ing of recipe.ingredients; track ing.name) {
                <span class="px-2 py-0.5 bg-slate-100 text-slate-500
                             text-xs rounded-full capitalize">
                  {{ ing.name }} x{{ ing.quantity }}
                </span>
              }
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
